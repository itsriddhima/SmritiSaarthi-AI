<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F4A45"/>
      <stop offset="100%" stop-color="#122E2B"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#E4A853"/>
    </linearGradient>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDA4AF"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>

  <!-- Subtle glow circle -->
  <circle cx="256" cy="256" r="180" fill="url(#goldGrad)" opacity="0.12" />

  <!-- Outer Sun Rays / Radiance -->
  <g stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round" opacity="0.85">
    <line x1="256" y1="90" x2="256" y2="120"/>
    <line x1="256" y1="392" x2="256" y2="422"/>
    <line x1="90" y1="256" x2="120" y2="256"/>
    <line x1="392" y1="256" x2="422" y2="256"/>
    <line x1="138" y1="138" x2="160" y2="160"/>
    <line x1="352" y1="352" x2="374" y2="374"/>
    <line x1="352" y1="160" x2="374" y2="138"/>
    <line x1="138" y1="374" x2="160" y2="352"/>
  </g>

  <!-- Central Brain-Lotus Floral Motif -->
  <g filter="url(#shadow)" fill="none">
    <!-- Center Golden Lotus Core -->
    <path d="M 256 160 C 230 200, 200 240, 200 280 C 200 320, 230 350, 256 350 C 282 350, 312 320, 312 280 C 312 240, 282 200, 256 160 Z" fill="url(#goldGrad)"/>
    <!-- Left Petal -->
    <path d="M 256 220 C 210 210, 160 250, 160 290 C 160 330, 200 350, 230 340 C 215 310, 230 260, 256 220 Z" fill="url(#goldGrad)" opacity="0.85"/>
    <!-- Right Petal -->
    <path d="M 256 220 C 302 210, 352 250, 352 290 C 352 330, 312 350, 282 340 C 297 310, 282 260, 256 220 Z" fill="url(#goldGrad)" opacity="0.85"/>
    <!-- Center Heart Motif for Loving Care -->
    <path d="M 256 295 C 248 285, 235 285, 230 295 C 225 305, 235 318, 256 332 C 277 318, 287 305, 282 295 C 277 285, 264 285, 256 295 Z" fill="url(#heartGrad)"/>
  </g>

  <!-- Sparkles -->
  <circle cx="210" cy="180" r="6" fill="#FFF" opacity="0.9"/>
  <circle cx="302" cy="180" r="6" fill="#FFF" opacity="0.9"/>
</svg>
